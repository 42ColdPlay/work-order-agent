server:
  port: 8080

spring:
  application:
    name: work-order-agent

  # 本地敏感配置：application-local.yml 已被 .gitignore 忽略，不会提交到仓库
  # 文件不存在时静默跳过，不影响他人克隆或生产部署
  config:
    import: optional:file:./application-local.yml

  # =========================================
  # MySQL 数据源
  # =========================================
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/work_order?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # =========================================
  # 建表脚本（替代 JPA ddl-auto，脚本内使用 IF NOT EXISTS 保证幂等）
  # =========================================
  sql:
    init:
      mode: always
      encoding: UTF-8

  # =========================================
  # Redis
  # =========================================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 0

  ai:
    # 禁用 Transformers ONNX 本地 Embedding（会从 GitHub 下载模型）
    # 改用 Ollama 的 nomic-embed-text
    embedding:
      transformer:
        enabled: false

    # =========================================
    # AI 模型配置（两种模式二选一）
    # =========================================

    # --- 默认：本地 Qwen2.5:7b（备选）---
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen2.5:7b
          temperature: 0.7

    # --- Embedding 模型 ---
    # 使用 Ollama 本地的 nomic-embed-text
    ollama.embedding:
      base-url: http://localhost:11434
      options:
        model: nomic-embed-text

    # --- Chroma 向量库 ---
    vectorstore:
      chroma:
        initialize-schema: true
        client:
          host: http://localhost
          port: 8000

# =========================================
# MyBatis
# =========================================
mybatis:
  # Mapper XML 位置
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    # 数据库下划线字段自动映射到 Java 驼峰属性
    map-underscore-to-camel-case: true

# =========================================
# RAG 检索配置
# =========================================
rag:
  # 相似度阈值：过高会大量过滤掉本来相关的内容（召回不足），过低会引入噪声
  # 中文语义检索建议 0.4 ~ 0.6，按实际效果调
  similarity-threshold: 0.5

# =========================================
# 记忆模块配置
# =========================================
memory:
  # 短期记忆：Redis 热缓存 + MySQL 流水
  chat:
    # Redis key 过期时间；过期后由 MySQL 自动重建
    ttl: 7d
    # Redis 保留与重建的最大条数
    max-messages: 100
    # 注入模型的 token 预算（粗略估算），超出从最旧的消息开始丢弃
    token-budget: 3000
    # 是否把消息流水落 MySQL。关闭后退化为纯 Redis 窗口
    persist: true

  # 长期记忆：每轮对话后异步抽取事实，存向量库 + MySQL
  longterm:
    enabled: true
    # 关闭可省掉每轮一次额外的 LLM 调用
    extraction-enabled: true
    top-k: 5
    # 召回阈值：低于该相似度的记忆不注入 prompt
    recall-threshold: 0.45
    # 相似度落在 [conflict-threshold, duplicate-threshold) 视为同一事实的新版本，
    # 旧记忆标记 SUPERSEDED 并由新记忆取代
    conflict-threshold: 0.8
    # 达到该阈值视为完全重复，直接跳过
    duplicate-threshold: 0.93
    max-facts-per-turn: 5
    # 用户消息短于该长度时跳过抽取
    min-message-length: 8
    executor-pool-size: 2

# =========================================
# 日志配置
# =========================================
logging:
  level:
    com.agent: DEBUG
    org.springframework.ai: INFO

# =========================================
# JWT 配置
# =========================================
jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}